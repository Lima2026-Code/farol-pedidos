<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farol de Pedidos — Selia Full Service</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0f172a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px;
      padding: 48px 40px;
      width: 100%;
      max-width: 400px;
      backdrop-filter: blur(20px);
      box-shadow: 0 32px 64px rgba(0,0,0,0.4);
      text-align: center;
    }
    .logo { font-size: 48px; margin-bottom: 8px; }
    h1 { color: #fff; font-size: 22px; font-weight: 700; margin-bottom: 4px; }
    .subtitle { color: rgba(255,255,255,0.45); font-size: 13px; margin-bottom: 36px; }
    .field { position: relative; margin-bottom: 16px; }
    input[type="password"], input[type="text"] {
      width: 100%;
      padding: 14px 48px 14px 18px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.08);
      color: #fff;
      font-size: 16px;
      outline: none;
      letter-spacing: 2px;
      transition: border 0.2s;
    }
    input::placeholder { letter-spacing: 0; color: rgba(255,255,255,0.3); }
    input:focus { border-color: rgba(59,130,246,0.7); }
    input:disabled { opacity: 0.4; cursor: not-allowed; }
    .toggle-pwd {
      position: absolute; right: 14px; top: 50%;
      transform: translateY(-50%);
      cursor: pointer; color: rgba(255,255,255,0.4);
      font-size: 18px; user-select: none;
    }
    button {
      width: 100%; padding: 14px; border-radius: 12px; border: none;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      color: #fff; font-size: 16px; font-weight: 700;
      cursor: pointer; transition: opacity 0.2s, transform 0.1s; margin-top: 4px;
    }
    button:hover:not(:disabled) { opacity: 0.9; transform: translateY(-1px); }
    button:active:not(:disabled) { transform: translateY(0); }
    button:disabled { opacity: 0.4; cursor: not-allowed; }
    .msg {
      display: none; font-size: 13px; margin-top: 12px;
      animation: shake 0.3s ease;
    }
    .msg.erro { color: #f87171; }
    .msg.bloq { color: #fbbf24; }
    @keyframes shake {
      0%,100%{transform:translateX(0)}
      25%{transform:translateX(-6px)}
      75%{transform:translateX(6px)}
    }
    .tentativas {
      color: rgba(255,255,255,0.25); font-size: 11px; margin-top: 8px; min-height: 16px;
    }
    .footer { color: rgba(255,255,255,0.2); font-size: 11px; margin-top: 36px; }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🚚</div>
    <h1>Farol de Pedidos</h1>
    <p class="subtitle">Selia Full Service · Monitoramento Pós-Despacho</p>

    <div class="field">
      <input type="password" id="pwd" placeholder="Senha de acesso"
             onkeydown="if(event.key==='Enter')entrar()" autocomplete="current-password">
      <span class="toggle-pwd" onclick="togglePwd()">👁</span>
    </div>
    <button id="btn" onclick="entrar()">Acessar Dashboard</button>

    <p class="msg erro" id="msg-erro">❌ Senha incorreta. Tente novamente.</p>
    <p class="msg bloq" id="msg-bloq">🔒 Muitas tentativas. Aguarde <span id="countdown"></span>.</p>
    <p class="tentativas" id="tent-info"></p>

    <p class="footer">Acesso restrito · Transportes Selia</p>
  </div>

  <script>
    // Hash SHA-256 da senha — a senha real não aparece no código
    // Para gerar novo hash: python3 -c "import hashlib; print(hashlib.sha256('SUA_SENHA'.encode()).hexdigest())"
    const _h = [
      '1d62b45f', '2b73f228', '944706e4', '2cfb041d',
      'db9991ab', '7ccbff91', 'b61bcb2a', '5c561695'
    ].join('');

    const MAX_TENT  = 5;     // tentativas antes de bloquear
    const BLOQ_MIN  = 30;    // minutos de bloqueio
    const CHAVE_T   = 'fp_t'; // tentativas
    const CHAVE_B   = 'fp_b'; // timestamp de bloqueio

    async function sha256(txt) {
      const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(txt));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2,'0')).join('');
    }

    function getBloqueio() {
      const ts = parseInt(localStorage.getItem(CHAVE_B) || '0');
      if (!ts) return 0;
      const restMs = ts - Date.now();
      return restMs > 0 ? restMs : 0;
    }

    function getTentativas() {
      return parseInt(localStorage.getItem(CHAVE_T) || '0');
    }

    function mostrar(id) {
      document.getElementById('msg-erro').style.display = 'none';
      document.getElementById('msg-bloq').style.display = 'none';
      if (id) document.getElementById(id).style.display = 'block';
    }

    function atualizarUI() {
      const restMs = getBloqueio();
      const tent   = getTentativas();
      const btn    = document.getElementById('btn');
      const inp    = document.getElementById('pwd');
      const info   = document.getElementById('tent-info');

      if (restMs > 0) {
        btn.disabled = true;
        inp.disabled = true;
        mostrar('msg-bloq');
        const min = Math.ceil(restMs / 60000);
        document.getElementById('countdown').textContent = min + ' min';
        info.textContent = '';
        setTimeout(atualizarUI, 10000); // reavalia a cada 10s
      } else {
        btn.disabled = false;
        inp.disabled = false;
        mostrar(null);
        if (tent > 0) {
          info.textContent = `⚠ ${tent} de ${MAX_TENT} tentativas usadas`;
        } else {
          info.textContent = '';
        }
      }
    }

    async function entrar() {
      if (getBloqueio() > 0) return;

      const val = document.getElementById('pwd').value.trim();
      if (!val) return;

      const hash = await sha256(val);

      if (hash === _h) {
        // Sucesso — limpa contadores e redireciona
        localStorage.removeItem(CHAVE_T);
        localStorage.removeItem(CHAVE_B);
        sessionStorage.setItem('farol_auth', 'ok');
        sessionStorage.setItem('farol_token', 'sf_20260825b');
        window.location.href = 'dashboard.html';
      } else {
        // Falha — incrementa contador
        let tent = getTentativas() + 1;
        localStorage.setItem(CHAVE_T, tent);

        if (tent >= MAX_TENT) {
          // Bloqueia por BLOQ_MIN minutos
          localStorage.setItem(CHAVE_B, Date.now() + BLOQ_MIN * 60 * 1000);
          localStorage.setItem(CHAVE_T, '0');
          atualizarUI();
        } else {
          mostrar('msg-erro');
          atualizarUI();
          // Delay progressivo: 1s, 2s, 3s... por tentativa
          await new Promise(r => setTimeout(r, tent * 1000));
          mostrar(null);
        }
      }
    }

    function togglePwd() {
      const i = document.getElementById('pwd');
      i.type = i.type === 'password' ? 'text' : 'password';
    }

    // Verifica bloqueio ao carregar a página
    atualizarUI();
  </script>
</body>
</html>
