<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Farol de Pedidos — Selia Full Service</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #0f172a 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .card {
      background: rgba(255,255,255,0.06);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 20px;
      padding: 48px 40px;
      width: 100%;
      max-width: 400px;
      backdrop-filter: blur(20px);
      box-shadow: 0 32px 64px rgba(0,0,0,0.4);
      text-align: center;
    }
    .logo {
      font-size: 48px;
      margin-bottom: 8px;
    }
    h1 {
      color: #fff;
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .subtitle {
      color: rgba(255,255,255,0.45);
      font-size: 13px;
      margin-bottom: 36px;
    }
    .field {
      position: relative;
      margin-bottom: 16px;
    }
    input[type="password"] {
      width: 100%;
      padding: 14px 48px 14px 18px;
      border-radius: 12px;
      border: 1px solid rgba(255,255,255,0.15);
      background: rgba(255,255,255,0.08);
      color: #fff;
      font-size: 16px;
      outline: none;
      letter-spacing: 2px;
      transition: border 0.2s;
    }
    input[type="password"]::placeholder { letter-spacing: 0; color: rgba(255,255,255,0.3); }
    input[type="password"]:focus { border-color: rgba(59,130,246,0.7); }
    .toggle-pwd {
      position: absolute;
      right: 14px;
      top: 50%;
      transform: translateY(-50%);
      cursor: pointer;
      color: rgba(255,255,255,0.4);
      font-size: 18px;
      user-select: none;
    }
    button {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: none;
      background: linear-gradient(135deg, #3b82f6, #1d4ed8);
      color: #fff;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s, transform 0.1s;
      margin-top: 4px;
    }
    button:hover { opacity: 0.9; transform: translateY(-1px); }
    button:active { transform: translateY(0); }
    .error {
      display: none;
      color: #f87171;
      font-size: 13px;
      margin-top: 12px;
      animation: shake 0.3s ease;
    }
    @keyframes shake {
      0%,100%{transform:translateX(0)}
      25%{transform:translateX(-6px)}
      75%{transform:translateX(6px)}
    }
    .footer {
      color: rgba(255,255,255,0.2);
      font-size: 11px;
      margin-top: 36px;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo">🚚</div>
    <h1>Farol de Pedidos</h1>
    <p class="subtitle">Selia Full Service · Monitoramento Pós-Despacho</p>

    <div class="field">
      <input type="password" id="pwd" placeholder="Senha de acesso" onkeydown="if(event.key==='Enter')entrar()">
      <span class="toggle-pwd" onclick="togglePwd()">👁</span>
    </div>
    <button onclick="entrar()">Acessar Dashboard</button>
    <p class="error" id="erro">❌ Senha incorreta. Tente novamente.</p>

    <p class="footer">Acesso restrito · Transportes Selia</p>
  </div>

  <script>
    function entrar() {
      const val = document.getElementById('pwd').value;
      if (val === 'Transportes2026') {
        sessionStorage.setItem('farol_auth', 'ok');
        window.location.href = 'dashboard.html';
      } else {
        const err = document.getElementById('erro');
        err.style.display = 'block';
        setTimeout(() => err.style.display = 'none', 3000);
      }
    }
    function togglePwd() {
      const i = document.getElementById('pwd');
      i.type = i.type === 'password' ? 'text' : 'password';
    }
  </script>
</body>
</html>
