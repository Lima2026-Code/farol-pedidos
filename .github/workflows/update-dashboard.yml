name: Atualizar Dashboard Farol

on:
  repository_dispatch:
    types: [update-dashboard]
  workflow_dispatch:
    inputs:
      html_content:
        description: 'Conteúdo do dashboard HTML (base64)'
        required: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Atualizar dashboard.html
        if: github.event_name == 'repository_dispatch'
        run: |
          echo "${{ github.event.client_payload.html_base64 }}" | base64 -d > dashboard.html
          echo "Dashboard atualizado em $(date '+%Y-%m-%d %H:%M')"

      - name: Commit e push
        run: |
          git config user.name "Farol Bot"
          git config user.email "bot@seliafullservice.com.br"
          git add dashboard.html
          git diff --staged --quiet || git commit -m "Atualização automática do dashboard - $(date '+%Y-%m-%d')"
          git push
